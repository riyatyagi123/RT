{% extends "base.html" %}
{% block title %}My Appointments — Svastha{% endblock %}
{% block content %}
<div class="page-header" style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:0.75rem;">
  <div>
    <h1>My Appointments</h1>
    <p>Everything you've booked, in one place.</p>
  </div>
  <span class="live-indicator" id="live-indicator">
    <span class="live-dot"></span> Live
  </span>
</div>

<div id="appointment-list-container">
  {% include "partials/patient_appointments.html" %}
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    function connect() {
      if (typeof io === "undefined") { setTimeout(connect, 100); return; }
      const socket = io();
      socket.on("appointments_changed", function () {
        fetch("{{ url_for('patient.appointments_partial') }}")
          .then((res) => res.text())
          .then((html) => {
            document.getElementById("appointment-list-container").innerHTML = html;
            const indicator = document.getElementById("live-indicator");
            indicator.classList.add("live-pulse");
            setTimeout(() => indicator.classList.remove("live-pulse"), 1200);
          });
      });
    }
    connect();
  });
</script>
{% endblock %}
